<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1b1c1a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Number Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<link rel="stylesheet" href="styles/style.css">
</head>
<body>

<div id="app">

  <!-- everything that shakes lives in here -->
  <div id="playfield">
    <canvas id="stage"></canvas>
  </div>

  <div id="ui">

    <!-- ============ in-game HUD ============ -->
    <div id="hud" class="hidden">
      <button id="btn-quit" class="icon-btn" aria-label="Quit game">
        <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 7 L25 25 M25 7 L7 25"/></svg>
      </button>
      <div id="score-pill"><span id="score">0</span></div>
      <div id="lives" aria-label="Lives remaining"></div>
      <div id="question-wrap">
        <div id="question"></div>
        <div id="timer-track"><div id="timer-fill"></div></div>
      </div>
      <div id="streak-badge" class="hidden"></div>
    </div>

    <!-- ============ home ============ -->
    <section id="screen-home" class="screen">
      <div class="home-inner">
        <h1 class="logo">Number<span>Pop</span></h1>
        <p class="tagline">Tap the right answer before it drifts away</p>
        <div class="home-buttons">
          <button class="btn btn-big" id="btn-play">Play</button>
          <button class="btn btn-ghost" id="btn-topics">Choose Topics</button>
        </div>
        <p class="best-line">Best: <b id="home-best">0</b> <span id="home-best-topic"></span></p>
      </div>
    </section>

    <!-- ============ topics / settings ============ -->
    <section id="screen-topics" class="screen hidden">
      <div class="sheet">
        <header class="sheet-head">
          <button class="icon-btn back" id="btn-topics-back" aria-label="Back">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M20 6 L10 16 L20 26"/></svg>
          </button>
          <h2>Choose Topics</h2>
        </header>

        <div class="sheet-body">
          <div class="field">
            <h3>What to practise</h3>
            <div class="chips" id="op-chips">
              <button class="chip op" data-op="mul">× Times</button>
              <button class="chip op" data-op="div">÷ Divide</button>
              <button class="chip op" data-op="add">+ Add</button>
              <button class="chip op" data-op="sub">− Subtract</button>
            </div>
          </div>

          <div class="field" id="field-tables">
            <h3>Times tables <button class="mini" id="btn-all-tables">all</button></h3>
            <div class="grid-tables" id="table-grid"></div>
            <div class="chips tight">
              <span class="label">up to</span>
              <button class="chip range" data-maxmul="10">10</button>
              <button class="chip range" data-maxmul="12">12</button>
            </div>
          </div>

          <div class="field" id="field-addsub">
            <h3>Add &amp; subtract numbers up to</h3>
            <div class="chips">
              <button class="chip addmax" data-max="10">10</button>
              <button class="chip addmax" data-max="20">20</button>
              <button class="chip addmax" data-max="50">50</button>
              <button class="chip addmax" data-max="100">100</button>
            </div>
          </div>

          <div class="field">
            <h3>Difficulty</h3>
            <div class="chips">
              <button class="chip diff" data-diff="easy">Easy</button>
              <button class="chip diff" data-diff="normal">Normal</button>
              <button class="chip diff" data-diff="hard">Hard</button>
            </div>
            <p class="hint" id="diff-hint"></p>
          </div>

          <div class="field">
            <h3>Sound</h3>
            <div class="chips">
              <button class="chip snd" data-snd="on">On</button>
              <button class="chip snd" data-snd="off">Off</button>
            </div>
          </div>
        </div>

        <footer class="sheet-foot">
          <button class="btn btn-big" id="btn-topics-play">Play</button>
        </footer>
      </div>
    </section>

    <!-- ============ game over ============ -->
    <section id="screen-gameover" class="screen hidden">
      <div class="over-card">
        <p class="over-label">You got</p>
        <p class="over-score" id="over-score">0</p>
        <p class="over-best"><span>Your highscore</span> <b id="over-best">0</b></p>
        <div class="over-buttons">
          <button class="btn" id="btn-over-ok">OK</button>
          <button class="btn btn-icon" id="btn-over-again" aria-label="Play again">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M26 16a10 10 0 1 1-3.2-7.3"/><path d="M27 5v6h-6"/></svg>
          </button>
        </div>
      </div>
      <div class="mascot-row">
        <div id="mascot"></div>
        <div class="speech"><p id="mascot-line"></p></div>
      </div>
    </section>

  </div>
</div>

<!-- ================= scripts (order matters: no bundler, plain globals) ================= -->
<script src="src/core/rng.js"></script>
<script src="src/core/storage.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/core/input.js"></script>
<script src="src/core/loop.js"></script>

<script src="src/art/theme.js"></script>
<script src="src/art/scenery.js"></script>
<script src="src/art/bubbleArt.js"></script>
<script src="src/art/mascot.js"></script>

<script src="src/game/distractors.js"></script>
<script src="src/game/questions.js"></script>
<script src="src/game/scoring.js"></script>
<script src="src/game/bubbles.js"></script>
<script src="src/game/effects.js"></script>
<script src="src/game/render.js"></script>
<script src="src/game/session.js"></script>

<script src="src/ui/hud.js"></script>
<script src="src/ui/screens.js"></script>
<script src="src/main.js"></script>

</body>
</html>
